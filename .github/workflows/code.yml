name: Docker Compose App Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}   
          password: ${{ secrets.DOCKERHUB_TOKEN }} 

      - name: Build and push backend
        uses: docker/build-push-action@v5   # The official build/push action
        with:
          context: ./Backend                # What folder to build (must contain a Dockerfile)
          push: true                        # After building, push to Docker Hub
          tags: |                           # Where to push (your repo + image name + tag)
            ${{ secrets.DOCKERHUB_USERNAME }}/quickreview-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5   # The official build/push action
        with:
          context: ./Backend                # What folder to build (must contain a Dockerfile)
          push: true                        # After building, push to Docker Hub
          tags: |                           # Where to push (your repo + image name + tag)
            ${{ secrets.DOCKERHUB_USERNAME }}/quickreview-backend:latest     